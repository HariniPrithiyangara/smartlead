version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: smartleads-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smartleads
    networks:
      - smartleads-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartleads-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/smartleads
      JWT_SECRET: ${JWT_SECRET:-smartleads_jwt_secret_change_in_production}
    depends_on:
      - mongo
    networks:
      - smartleads-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartleads-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - smartleads-network

volumes:
  mongo_data:

networks:
  smartleads-network:
    driver: bridge
